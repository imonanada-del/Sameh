<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعاب مفيدة | أكاديمية هداية الدولية للناشئين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root{
    --cream: #FFF6E1;
    --cream-2: #FFEFC7;
    --sun-yellow: #FFC93C;
    --sun-orange: #FF9F1C;
    --turquoise: #14B8A6;
    --turquoise-dark: #0E8E7E;
    --sky-blue: #3DB8E0;
    --coral: #FF6B6B;
    --coral-dark: #E1483F;
    --navy: #123350;
    --navy-soft: #285678;
    --purple: #7B61FF;
    --shadow: 0 10px 0 rgba(18,51,80,0.12);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 60%, #FFE3A8 100%);
    font-family:'Cairo', sans-serif;
    color:var(--navy);
    overflow-x:hidden;
  }

  button{ font-family:inherit; border:none; cursor:pointer; background:none; color:inherit; }

  /* ===================== BACKGROUND DECOR ===================== */
  .bg-decor{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .cloud{
    position:absolute; opacity:.85; font-size:2.6rem; filter:drop-shadow(0 4px 0 rgba(255,255,255,.4));
    animation: floatCloud linear infinite;
  }
  .cloud.c1{ top:8%; animation-duration:38s; }
  .cloud.c2{ top:18%; animation-duration:52s; font-size:2rem; animation-delay:-10s;}
  .cloud.c3{ top:6%; animation-duration:46s; font-size:1.6rem; animation-delay:-25s;}
  @keyframes floatCloud{
    from{ transform:translateX(-15vw); }
    to{ transform:translateX(115vw); }
  }
  .wave{
    position:absolute; bottom:0; left:0; width:100%; height:14vh; min-height:70px;
    background: repeating-linear-gradient(90deg, var(--turquoise) 0 40px, var(--turquoise-dark) 40px 80px);
    clip-path: polygon(0 40%, 5% 30%, 10% 40%, 15% 30%, 20% 40%, 25% 30%, 30% 40%, 35% 30%, 40% 40%, 45% 30%, 50% 40%, 55% 30%, 60% 40%, 65% 30%, 70% 40%, 75% 30%, 80% 40%, 85% 30%, 90% 40%, 95% 30%, 100% 40%, 100% 100%, 0 100%);
    opacity:.35;
  }

  /* ===================== SCREENS ===================== */
  .screen{ display:none; min-height:100dvh; position:relative; z-index:1; }
  .screen.active{ display:flex; flex-direction:column; }

  /* ===================== HOME ===================== */
  #home-screen{ align-items:center; padding: env(safe-area-inset-top,0) 1rem 3rem; }

  .hero{
    width:100%; max-width:640px; text-align:center;
    padding-top: clamp(1.2rem, 4vh, 2.5rem);
  }

  .sun-svg{ width: clamp(120px,28vw,180px); height:auto; }
  .rays{ transform-origin:100px 100px; animation:spin 50s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  .sun-wrap{ animation:bob 4.5s ease-in-out infinite; display:inline-block; }

  .site-title{
    font-family:'Lalezar', sans-serif;
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    margin: .2rem 0 0;
    background: linear-gradient(180deg, var(--sun-orange), var(--coral-dark));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:1px;
    line-height:1.1;
    text-shadow: 0 2px 0 rgba(255,255,255,.4);
  }
  .site-subtitle{
    font-weight:800; font-size:clamp(1.05rem, 3.4vw, 1.4rem);
    color:var(--navy); margin:.5rem 0 0; opacity:.92;
  }

  .games-grid{
    width:100%; max-width:640px; margin-top: clamp(1.5rem,4vh,2.5rem);
    display:grid; grid-template-columns:1fr; gap:1.1rem;
  }
  @media (min-width:640px){
    .games-grid{ grid-template-columns:1fr 1fr; }
    .games-grid .active-card{ grid-column: 1 / -1; }
  }

  .game-card{
    position:relative; border-radius:28px; padding:1.6rem 1.4rem 1.5rem;
    text-align:center; display:flex; flex-direction:column; align-items:center; gap:.35rem;
    min-height:150px; justify-content:center;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
    border: 3px solid rgba(255,255,255,.55);
  }
  .game-card:active{ transform: translateY(6px); box-shadow:0 4px 0 rgba(18,51,80,.12); }

  .active-card{
    background: linear-gradient(150deg, var(--turquoise) 0%, var(--sky-blue) 100%);
    color:#fff;
    min-height:190px;
  }
  .card-icon{ font-size:2.6rem; filter:drop-shadow(0 3px 0 rgba(0,0,0,.12)); }
  .active-card h2{ font-family:'Lalezar', sans-serif; font-size:1.7rem; margin:.1rem 0; letter-spacing:.5px; }
  .active-card p{ margin:0; font-weight:700; opacity:.95; font-size:.95rem; }
  .card-count{
    background:rgba(255,255,255,.25); padding:.25rem .9rem; border-radius:999px;
    font-size:.85rem; font-weight:800; margin-top:.2rem;
  }
  .play-btn{
    margin-top:.6rem; background:#fff; color:var(--turquoise-dark);
    font-weight:900; padding:.85rem 2rem; border-radius:999px; font-size:1.05rem;
    box-shadow:0 5px 0 rgba(0,0,0,.12);
  }

  .soon-card{
    background: linear-gradient(150deg, #FFF, var(--cream-2));
    color:var(--navy-soft); opacity:.85;
  }
  .soon-card h2{ font-family:'Lalezar', sans-serif; font-size:1.3rem; margin:.1rem 0; }
  .soon-badge{
    background: rgba(123,97,255,.12); color:var(--purple);
    font-weight:800; font-size:.8rem; padding:.3rem .8rem; border-radius:999px;
  }

  /* ===================== GAME SCREEN ===================== */
  #game-screen{
    background: linear-gradient(180deg, var(--turquoise-dark), var(--turquoise) 40%, #22C4B0 100%);
    color:#fff; min-height:100dvh; padding: max(env(safe-area-inset-top,0),1rem) 1rem calc(env(safe-area-inset-bottom,0) + 1rem);
  }
  .game-header{
    display:flex; align-items:center; gap:.8rem; width:100%; max-width:640px; margin:0 auto;
  }
  .back-btn{
    background:rgba(255,255,255,.2); font-weight:800; padding:.6rem 1rem; border-radius:999px;
    font-size:.95rem; flex-shrink:0;
  }
  .progress-wrap{
    flex:1; background:rgba(255,255,255,.25); border-radius:999px; height:14px; overflow:hidden;
  }
  .progress-bar{ height:100%; width:0%; background:var(--sun-yellow); border-radius:999px; transition:width .35s ease; }
  .question-counter{ font-weight:900; font-size:.95rem; flex-shrink:0; min-width:52px; text-align:left; }

  .question-area{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; max-width:640px; margin:0 auto; padding: 1.5rem 0; gap:1rem; position:relative;
  }
  .q-card{
    background:#fff; color:var(--navy); border-radius:28px; padding: 2rem 1.6rem;
    width:100%; text-align:center; box-shadow:0 10px 0 rgba(0,0,0,.12);
    display:flex; flex-direction:column; gap:.8rem; min-height:180px; justify-content:center;
    position:relative; overflow:visible;
  }
  .sparkle-layer{ position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:5; }
  .sparkle{
    position:absolute; font-size:1.5rem; opacity:0;
    animation: sparklePop .9s ease-out forwards;
  }
  @keyframes sparklePop{
    0%{ transform:scale(0) translateY(0) rotate(0deg); opacity:0; }
    25%{ opacity:1; transform:scale(1.3) translateY(-14px) rotate(15deg); }
    100%{ transform:scale(.5) translateY(-70px) rotate(60deg); opacity:0; }
  }
  .q-label{ font-weight:800; color:var(--sun-orange); font-size:.95rem; }
  .q-text{
    font-family:'Lalezar', sans-serif; font-size: clamp(1.35rem, 5vw, 1.9rem);
    line-height:1.6; margin:0; color:var(--navy);
  }
  .feedback{
    font-weight:900; font-size:1.3rem; min-height:2.2rem; display:flex; align-items:center; gap:.5rem;
    opacity:0; transform:translateY(6px); transition:opacity .25s ease, transform .25s ease;
  }
  .feedback.show{ opacity:1; transform:translateY(0); }
  .feedback.correct{ color:#fff; }
  .feedback.wrong{ color:#FFE1E1; }

  .answers-row{
    display:flex; gap:1rem; width:100%; max-width:640px; margin:0 auto; padding-bottom:.5rem;
  }
  .ans-btn{
    flex:1; padding:1.3rem .5rem; border-radius:24px; font-size:1.35rem; font-weight:900;
    display:flex; flex-direction:column; align-items:center; gap:.2rem;
    box-shadow:0 7px 0 rgba(0,0,0,.18);
    transition: transform .1s ease, box-shadow .1s ease;
    min-height:78px;
  }
  .ans-btn:active{ transform:translateY(6px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
  .ans-btn span{ font-size:1.1rem; }
  .true-btn{ background: linear-gradient(180deg, #3FDC9A, #1FAF74); color:#fff; }
  .false-btn{ background: linear-gradient(180deg, var(--coral), var(--coral-dark)); color:#fff; }
  .ans-btn:disabled{ opacity:.55; pointer-events:none; }
  .ans-btn.picked{ outline:5px solid rgba(255,255,255,.85); }

  /* ===================== RESULT SCREEN ===================== */
  #result-screen{
    align-items:center; justify-content:center; min-height:100dvh; padding:2rem 1rem; position:relative;
    background: radial-gradient(circle at 50% 20%, #FFEFC0, var(--cream) 65%);
  }
  .result-card{
    background:#fff; border-radius:32px; padding:2.3rem 1.8rem; text-align:center;
    max-width:420px; width:100%; box-shadow:0 12px 0 rgba(18,51,80,.12); position:relative; z-index:2;
  }
  .result-emoji{ font-size:4rem; margin-bottom:.3rem; }
  .result-card h2{ font-family:'Lalezar', sans-serif; font-size:2.1rem; color:var(--sun-orange); margin:.2rem 0; }
  .result-card p{ font-weight:800; font-size:1.15rem; color:var(--navy); margin:.3rem 0 1rem; }
  .stars{ font-size:2rem; margin-bottom:1.2rem; letter-spacing:.3rem; }
  .result-btns{ display:flex; flex-direction:column; gap:.8rem; }
  .retry-btn, .home-btn{
    padding:1rem; border-radius:999px; font-weight:900; font-size:1.05rem;
    box-shadow:0 6px 0 rgba(0,0,0,.14);
  }
  .retry-btn{ background: linear-gradient(180deg, var(--sun-yellow), var(--sun-orange)); color:var(--navy); }
  .home-btn{ background: linear-gradient(180deg, var(--turquoise), var(--turquoise-dark)); color:#fff; }
  .retry-btn:active, .home-btn:active{ transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.14); }

  .confetti-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
  .confetti-piece{
    position:absolute; top:-10%; font-size:1.4rem; animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(400deg); opacity:.9; }
  }

  /* ===================== TOAST ===================== */
  .toast{
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0) + 1.4rem); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; font-weight:800; padding:.9rem 1.6rem; border-radius:999px;
    box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:50; font-size:.95rem; pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:360px){
    .site-title{ font-size:2.3rem; }
  }
</style>
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>
  <div class="cloud c3">☁️</div>
  <div class="wave"></div>
</div>

<!-- ===================== HOME SCREEN ===================== -->
<section id="home-screen" class="screen active">
  <div class="hero">
    <div class="sun-wrap">
      <svg class="sun-svg" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="sunGrad" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FFEE9C"/>
            <stop offset="55%" stop-color="#FFC93C"/>
            <stop offset="100%" stop-color="#FF9F1C"/>
          </radialGradient>
        </defs>
        <g class="rays" stroke="#FF9F1C" stroke-width="9" stroke-linecap="round">
          <line x1="100" y1="10" x2="100" y2="32"/>
          <line x1="100" y1="168" x2="100" y2="190"/>
          <line x1="10" y1="100" x2="32" y2="100"/>
          <line x1="168" y1="100" x2="190" y2="100"/>
          <line x1="38" y1="38" x2="53" y2="53"/>
          <line x1="147" y1="147" x2="162" y2="162"/>
          <line x1="162" y1="38" x2="147" y2="53"/>
          <line x1="53" y1="147" x2="38" y2="162"/>
        </g>
        <circle cx="100" cy="100" r="56" fill="url(#sunGrad)" stroke="#FF9F1C" stroke-width="3"/>
        <circle cx="82" cy="92" r="6" fill="#123350"/>
        <circle cx="118" cy="92" r="6" fill="#123350"/>
        <path d="M78 116 Q100 138 122 116" stroke="#123350" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="70" cy="112" r="7" fill="#FF6B6B" opacity=".55"/>
        <circle cx="130" cy="112" r="7" fill="#FF6B6B" opacity=".55"/>
      </svg>
    </div>
    <h1 class="site-title">ألعاب مفيدة</h1>
    <p class="site-subtitle">مع أكاديمية هداية الدولية للناشئين</p>
  </div>

  <main class="games-grid">
    <button class="game-card active-card" onclick="openGame()">
      <span class="card-icon">🌟</span>
      <h2>لعبة القناعة</h2>
      <p>صح أم خطأ؟ اختبر معلوماتك في خُلُق القناعة</p>
      <span class="card-count">٩ أسئلة</span>
      <span class="play-btn">ابدأ اللعبة</span>
    </button>
  </main>
</section>

<!-- ===================== GAME SCREEN ===================== -->
<section id="game-screen" class="screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">رجوع ➜</button>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <span class="question-counter" id="questionCounter">١ / ٩</span>
  </div>

  <div class="question-area">
    <div class="q-card">
      <span class="q-label">هل هذه العبارة صحيحة؟</span>
      <p class="q-text" id="qText"></p>
      <div class="sparkle-layer" id="sparkleLayer"></div>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="answers-row">
    <button class="ans-btn true-btn" id="btnTrue" onclick="answer(true)">
      ✅ <span>صح</span>
    </button>
    <button class="ans-btn false-btn" id="btnFalse" onclick="answer(false)">
      ❎ <span>خطأ</span>
    </button>
  </div>
</section>

<!-- ===================== RESULT SCREEN ===================== -->
<section id="result-screen" class="screen">
  <div class="confetti-layer" id="confetti"></div>
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">أحسنت!</h2>
    <p id="resultScore">حصلت على ٩ من ٩</p>
    <div class="stars" id="stars">⭐⭐⭐</div>
    <div class="result-btns">
      <button class="retry-btn" onclick="retryGame()">🔁 إعادة اللعب</button>
      <button class="home-btn" onclick="goHome()">🏠 الرئيسية</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
  const questions = [
    { text: "ذُكِرَ خُلُقُ القناعةِ في كتابِ اللهِ وسنةِ رسولِهِ صلى الله عليه وسلم", answer: true },
    { text: "القناعةُ هي الرضا بما أعطى اللهُ", answer: true },
    { text: "القناعةُ سببٌ لنيلِ محبةِ اللهِ", answer: true },
    { text: "القناعةُ علامةٌ على نقصِ الإيمانِ", answer: false },
    { text: "القناعةُ طريقٌ موصلٌ إلى الجنةِ", answer: true },
    { text: "القناعةُ تجعلك تعيشُ حياةً هنيئةً طيبةً", answer: true },
    { text: "القناعةُ هي النظرُ فيما عند الناسِ", answer: false },
    { text: "القناعةُ تُكْسِبُ صاحبَها غِنى النفسِ", answer: true },
    { text: "القناعةُ تحقيقٌ لشكرِ اللهِ تعالى على نِعَمِهِ", answer: true }
  ];

  const arabicDigits = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  function toArabicNum(n){
    return String(n).split("").map(d => arabicDigits[+d] ?? d).join("");
  }

  let currentIndex = 0;
  let score = 0;
  let locked = false;

  /* ===================== SOUND ENGINE ===================== */
  let audioCtx;
  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  function playClick(){
    try{
      const ctx = getAudioCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 520;
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.1);
    }catch(e){}
  }

  function playCorrectSound(){
    try{
      const ctx = getAudioCtx();
      const notes = [523.25, 659.25, 783.99, 1046.5]; // فرحة صاعدة
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        const start = ctx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
        o.connect(g); g.connect(ctx.destination);
        o.start(start); o.stop(start + 0.3);
      });
    }catch(e){}
  }

  function playWrongSound(){
    try{
      const ctx = getAudioCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(300, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.35);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.36);
    }catch(e){}
  }

  function playWinFanfare(){
    try{
      const ctx = getAudioCtx();
      const notes = [523.25, 523.25, 523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        const start = ctx.currentTime + i * 0.12;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
        o.connect(g); g.connect(ctx.destination);
        o.start(start); o.stop(start + 0.32);
      });
    }catch(e){}
  }

  /* ===================== SPARKLE STARS ===================== */
  function launchSparkles(){
    const layer = document.getElementById('sparkleLayer');
    if(!layer) return;
    layer.innerHTML = '';
    const icons = ['⭐','✨','🌟'];
    const count = 12;
    for(let i = 0; i < count; i++){
      const span = document.createElement('span');
      span.className = 'sparkle';
      span.textContent = icons[Math.floor(Math.random() * icons.length)];
      span.style.left = (5 + Math.random() * 90) + '%';
      span.style.top = (10 + Math.random() * 70) + '%';
      span.style.animationDelay = (Math.random() * 0.25) + 's';
      span.style.fontSize = (1.1 + Math.random() * 1.1) + 'rem';
      layer.appendChild(span);
    }
    setTimeout(() => { layer.innerHTML = ''; }, 1200);
  }

  const screens = {
    home: document.getElementById('home-screen'),
    game: document.getElementById('game-screen'),
    result: document.getElementById('result-screen')
  };

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    window.scrollTo(0,0);
  }

  function openGame(){
    playClick();
    currentIndex = 0;
    score = 0;
    showScreen('game');
    renderQuestion();
  }

  function goHome(){
    playClick();
    showScreen('home');
  }

  function renderQuestion(){
    locked = false;
    const q = questions[currentIndex];
    document.getElementById('qText').textContent = q.text;
    document.getElementById('questionCounter').textContent =
      toArabicNum(currentIndex + 1) + ' / ' + toArabicNum(questions.length);
    document.getElementById('progressBar').style.width =
      ((currentIndex) / questions.length * 100) + '%';

    const fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.textContent = '';

    const btnTrue = document.getElementById('btnTrue');
    const btnFalse = document.getElementById('btnFalse');
    btnTrue.disabled = false;
    btnFalse.disabled = false;
    btnTrue.classList.remove('picked');
    btnFalse.classList.remove('picked');
  }

  function answer(userAnswer){
    if(locked) return;
    locked = true;
    playClick();

    const q = questions[currentIndex];
    const correct = userAnswer === q.answer;
    if(correct) score++;

    const btnTrue = document.getElementById('btnTrue');
    const btnFalse = document.getElementById('btnFalse');
    btnTrue.disabled = true;
    btnFalse.disabled = true;
    (userAnswer ? btnTrue : btnFalse).classList.add('picked');

    const fb = document.getElementById('feedback');
    fb.textContent = correct ? '✅ إجابة صحيحة، أحسنت!' : '❌ إجابة غير صحيحة';
    fb.className = 'feedback show ' + (correct ? 'correct' : 'wrong');

    setTimeout(() => {
      if(correct){ playCorrectSound(); launchSparkles(); }
      else{ playWrongSound(); }
    }, 120);

    document.getElementById('progressBar').style.width =
      ((currentIndex + 1) / questions.length * 100) + '%';

    setTimeout(() => {
      currentIndex++;
      if(currentIndex < questions.length){
        renderQuestion();
      } else {
        showResult();
      }
    }, 1100);
  }

  function showResult(){
    showScreen('result');
    const total = questions.length;
    document.getElementById('resultScore').textContent =
      'حصلت على ' + toArabicNum(score) + ' من ' + toArabicNum(total);

    let emoji, title, starsCount;
    const ratio = score / total;
    if(ratio === 1){ emoji = '🏆'; title = 'ممتاز! إجابات كاملة'; starsCount = 3; }
    else if(ratio >= 0.7){ emoji = '🎉'; title = 'أحسنت صنعًا!'; starsCount = 3; }
    else if(ratio >= 0.4){ emoji = '🙂'; title = 'جيد، حاول مرة أخرى'; starsCount = 2; }
    else { emoji = '💪'; title = 'حاول مجددًا وستتقن!'; starsCount = 1; }

    document.getElementById('resultEmoji').textContent = emoji;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('stars').textContent = '⭐'.repeat(starsCount) + '☆'.repeat(3 - starsCount);

    launchConfetti(ratio >= 0.7);
    setTimeout(() => { if(ratio >= 0.7) playWinFanfare(); }, 200);
  }

  function retryGame(){
    playClick();
    openGame();
  }

  function launchConfetti(big){
    const layer = document.getElementById('confetti');
    layer.innerHTML = '';
    const pieces = ['🎉','⭐','🌟','☀️','🎈','✨'];
    const count = big ? 26 : 14;
    for(let i=0;i<count;i++){
      const span = document.createElement('span');
      span.className = 'confetti-piece';
      span.textContent = pieces[Math.floor(Math.random()*pieces.length)];
      span.style.left = Math.random()*100 + '%';
      span.style.animationDuration = (2.5 + Math.random()*2) + 's';
      span.style.animationDelay = (Math.random()*0.6) + 's';
      span.style.fontSize = (1 + Math.random()*1.2) + 'rem';
      layer.appendChild(span);
    }
    setTimeout(() => { layer.innerHTML = ''; }, 5000);
  }

  let toastTimer;
  function comingSoon(){
    playClick();
    const toast = document.getElementById('toast');
    toast.textContent = '🌞 هذه اللعبة قادمة قريبًا إن شاء الله!';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
